<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(-45deg, #0b1120, #1e293b, #0d9488, #0b1120); background-size: 400% 400%; animation: gradientMove 10s ease infinite; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .app-card { width: 100%; max-width: 440px; background: white; border-radius: 2.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 2rem; }
        #main-content { display: none; width: 100%; }
        .input-monto::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body>

    <div class="app-card">
        <div id="login-screen" class="space-y-6 py-12">
            <div class="text-center">
                <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Acceso de Agente</h2>
                <p class="text-xs text-slate-400 font-bold uppercase">Introduce tus credenciales</p>
            </div>
            <div class="w-full space-y-4 px-8">
                <input type="text" id="user" placeholder="Usuario" class="w-full border-b-2 py-3 px-4 outline-none font-bold text-center text-slate-700 uppercase">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full border-b-2 py-3 px-4 outline-none font-bold text-center text-slate-700">
                <button onclick="checkLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all">Ingresar</button>
            </div>
            <p id="error-msg" class="text-red-500 text-[10px] font-black uppercase hidden text-center">Credenciales Incorrectas</p>
        </div>

        <div id="main-content">
            <div id="header-bg" class="bg-[#14b8a6] pt-10 pb-4 text-center transition-colors duration-500">
                <div class="w-20 h-20 bg-white rounded-3xl mx-auto mb-4 flex items-center justify-center overflow-hidden border-4 border-white/20">
                    <img id="img-previa" src="" class="w-full h-full object-cover">
                </div>
                <div class="px-8 mb-4">
                    <select id="prod" onchange="updateUI()" class="w-full border-none rounded-xl px-4 py-2 font-bold text-center outline-none bg-white">
                        <option value="baubap">Baubap</option>
                        <option value="vivus">Vivus</option>
                        <option value="efectivohoy">Efectivo Hoy</option>
                        <option value="inuprestamos">iNU Prestamos</option>
                        <option value="okcredito">OK CRÉDITO</option>
                        <option value="creditala">CREDITALA</option>
                        <option value="affluente">Affluente Financiero</option>
                        <option value="prestamos">Préstamos</option>
                        <option value="dinero">Préstamos de Dinero</option>
                        <option value="nu">Préstamos NU</option>
                        <option value="talacred">Tala Crédito</option>
                        <option value="mercadona">MERCADONA</option>
                        <option value="tilt">Tilt</option>
                        <option value="dida">DidaPréstamos</option>
                        <option value="rapidos">Préstamos rápidos</option>
                        <option value="worldmox">Worldmoxpro cash</option>
                        <option value="movil">Movil Cash</option>
                        <option value="cashcredit">Cash Credit</option>
                        <option value="stori">Stori Crédito</option>
                        <option value="facil">Fácil Préstamo</option>
                        <option value="tala">Tala Préstamos</option>
                        <option value="cashmexico">CashMexico</option>
                        <option value="mexicash">MexiCash Credit</option>
                        <option value="okdinero">Ok Dinero</option>
                        <option value="popprestamo">Pop Prestamo</option>
                        <option value="quickfondo">Quick Fondo VIP</option>
                        <option value="efecrapid">EfecRápid</option>
                        <option value="raizcredito">Raíz Credito</option>
                        <option value="rapidocredito">Rápido Credito</option>
                        <option value="clickprestamo">Click Prestamo</option>
                        <option value="pesitolisto">Pesito Listo</option>
                        <option value="cashrapido">Cash rápido</option>
                        <option value="crecidinero">Creci Dinero</option>
                    </select>
                </div>
                <div id="monto-bg" class="bg-[#65a30d] mx-6 p-6 rounded-[1.5rem] text-left text-white transition-colors duration-500">
                    <span class="text-[10px] font-bold opacity-70 uppercase">Monto de Pago</span>
                    <div class="flex items-center text-4xl font-black">
                        <span>$</span>
                        <input type="number" id="monto" value="0.00" step="0.01" class="input-monto bg-transparent border-none outline-none w-full text-white ml-1">
                    </div>
                </div>
            </div>

            <div class="p-6 space-y-4 text-sm font-bold text-slate-800">
                <div class="flex justify-between border-b pb-2"><span class="text-gray-400 uppercase text-[10px]">Importe</span><span id="l-monto">$0.00</span></div>
                
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-400 uppercase text-[10px]">Fecha Vencimiento</span>
                    <input type="date" id="fecha" onchange="calcDias()" class="outline-none text-right font-bold bg-white">
                </div>
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-400 uppercase text-[10px]">Días Vencimiento</span>
                    <span id="l-dias" class="font-black text-lg">0</span>
                </div>

                <div class="bg-gray-50 rounded-[2rem] p-6 text-center space-y-3 border border-gray-100">
                    <span class="text-[10px] text-gray-400 uppercase">Método de Pago</span>
                    <select id="metodo" onchange="updateClabe()" class="w-full border rounded-xl p-2 text-center outline-none bg-white font-black text-xs">
                        <option value="STP" data-clabe="646180402324694126">STP</option>
                        <option value="NEQUI" data-clabe="3059092752">NEQUI</option>
                    </select>
                    <span class="text-[10px] text-gray-400 uppercase">Liga de Pago</span>
                    <div id="display-clabe" class="w-full border rounded-xl p-2 text-center text-blue-600 bg-white font-black text-sm">646180402347894893</div>
                </div>

                <div class="space-y-2">
                    <input type="text" id="nom" placeholder="Nombre del cliente" class="w-full border-b py-2 text-center outline-none uppercase font-bold">
                    <input type="tel" id="tel" placeholder="Número del cliente (10 dígitos)" class="w-full border-b py-2 text-center outline-none font-bold">
                </div>

                <button onclick="generar()" id="btn" class="w-full bg-[#65a30d] text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs">GENERAR ORDEN</button>
            </div>
        </div>
    </div>

            dida: { name: 'DidaPréstamos', color: '#0057ff', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/e2/14/27/e21427df-1404-f93c-c8b9-230ef12d4870/Placeholder.mill/400x400bb-75.webp' },

            cashcredit: { name: 'Cash Credit', color: '#f59e0b', img: 'https://play-lh.googleusercontent.com/kw_CZs5smCFpyFtI9pWkKhY1eRfX6E15tdTEU_KpxTaUYzUtRFx9b8eOJYpn-Ze4BQ=w480-h960-rw' },
            stori: { name: 'Stori Crédito', color: '#7c3aed', img: 'https://play-lh.googleusercontent.com/oXTAgpljdbV5LuAOt1NP9_JafUZe9BNl7pwQ01ndl4blYL4N4IQh4-n456P5l_hc1A=s96-rw' },

            clickprestamo: { name: 'Click Prestamo', color: '#ea580c', img: 'https://clicredito.mx/assets/frontend/images/logo.svg' },

        };

        function checkLogin() {
            const u = document.getElementById('user').value.toLowerCase();
            const p = document.getElementById('pass').value;
            if(u === "admin" && p === "0015985400") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                updateUI();
                updateClabe();
            } else { 
                document.getElementById('error-msg').classList.remove('hidden'); 
            }
        }

        function updateUI() {
            const val = document.getElementById('prod').value;
            const app = APPS[val];
            if(app) {
                document.getElementById('header-bg').style.backgroundColor = app.color;
                document.getElementById('monto-bg').style.backgroundColor = app.color;
                document.getElementById('btn').style.backgroundColor = app.color;
                document.getElementById('img-previa').src = app.img;
            }
        }

        function updateClabe() {
            const select = document.getElementById('metodo');
            const clabe = select.options[select.selectedIndex].getAttribute('data-clabe');
            document.getElementById('display-clabe').innerText = clabe;
        }

        document.getElementById('fecha').valueAsDate = new Date();
        document.getElementById('monto').addEventListener('input', (e) => { 
            document.getElementById('l-monto').innerText = '$' + (e.target.value || "0.00"); 
        });

        function calcDias() {
            const f = new Date(document.getElementById('fecha').value);
            const hoy = new Date(); hoy.setHours(0,0,0,0); f.setHours(0,0,0,0);
            const diffDays = Math.ceil((hoy - f) / (1000 * 60 * 60 * 24));
            const el = document.getElementById('l-dias');
            el.innerText = diffDays > 0 ? diffDays : "0";
            el.style.color = diffDays > 0 ? "#ef4444" : "#1e293b";
        }

        function generar() {
            const appKey = document.getElementById('prod').value;
            const monto = document.getElementById('monto').value || "0.00";
            const nom = encodeURIComponent(document.getElementById('nom').value || "Cliente");
            const tel = document.getElementById('tel').value || "0000000000";
            const banco = document.getElementById('metodo').value;
            const clabe = document.getElementById('display-clabe').innerText;

            const url = `detalle.html?app=${appKey}&m=${monto}&n=${nom}&t=${tel}&b=${banco}&c=${clabe}`;
            window.location.href = url;
        }
    </script>
</body>
</html>
