<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orden de Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">
    <div class="w-full max-width-[400px] bg-white rounded-[2.5rem] shadow-xl overflow-hidden">
        <div id="header-color" class="pt-8 pb-4 text-center">
            <img id="app-logo" src="" class="w-20 h-20 mx-auto rounded-3xl border-4 border-white/30 shadow-lg mb-2 object-cover">
            <h1 id="app-name" class="text-white font-black text-xl uppercase italic tracking-tighter"></h1>
        </div>

        <div class="p-6 space-y-6">
            <div class="text-center">
                <span class="text-[10px] text-gray-400 font-bold uppercase">Monto a pagar</span>
                <p id="monto-pago" class="text-4xl font-black text-slate-800"></p>
            </div>

            <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                <div class="flex justify-between text-[11px] font-bold">
                    <span class="text-gray-400 uppercase">Cliente:</span>
                    <span id="cliente-nombre" class="text-slate-800 uppercase"></span>
                </div>
                <div class="flex justify-between text-[11px] font-bold">
                    <span class="text-gray-400 uppercase">Banco:</span>
                    <span id="banco-nombre" class="text-slate-800"></span>
                </div>
                <div class="flex justify-between text-[11px] font-bold">
                    <span class="text-gray-400 uppercase">CLABE/Liga:</span>
                    <span id="clabe-valor" class="text-blue-600"></span>
                </div>
            </div>

            <div class="text-center">
                <p class="text-[9px] text-gray-400 font-bold uppercase leading-tight">
                    Realiza tu pago antes del vencimiento para evitar cargos adicionales.
                </p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const app = params.get('v');

        const apps = {
            'prestamos': { n: 'Préstamos', c: '#a3e635', l: 'https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/cb/a8/7a/cba87ab7-2fe9-aad7-e49f-a367d6c410b4/AppIcon-1x_U007ephone-0-1-0-85-220-0.jpeg/1200x630wa.png' },
            'dinero': { n: 'Préstamos de Dinero', c: '#1e40af', l: 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/31/78/92/317892a1-467e-c2c7-b7c5-be2a58b7d358/AppIcon-1x_U007ephone-0-1-0-85-220-0.png/400x400ia-75.webp' },
            'nu': { n: 'Préstamos NU', c: '#820ad1', l: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Nubank_logo_2021.svg/1200px-Nubank_logo_2021.svg.png' },
            'talacred': { n: 'Tala Crédito', c: '#06b6d4', l: 'https://pbs.twimg.com/profile_images/1604930218606600199/95CGdKAG_400x400.png' },
            'dida': { n: 'DidaPréstamos', c: '#0057ff', l: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/e2/14/27/e21427df-1404-f93c-c8b9-230ef12d4870/Placeholder.mill/400x400bb-75.webp' },
            'rapidos': { n: 'Préstamos Rápidos', c: '#10b981', l: 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/7f/68/39/7f683903-e675-6fbc-56fa-64d6fb206e2d/AppIcon-1x_U007ephone-0-1-0-85-220-0.jpeg/400x400ia-75.webp' },
            'worldmox': { n: 'Worldmoxpro cash', c: '#1e293b', l: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOQ9FrkHlgWkaMJt_Za2IN0R5Z0UamJ_VQKg&s' },
            'movil': { n: 'Movil Cash', c: '#22c55e', l: 'https://play-lh.googleusercontent.com/OhU802wo_ffOcR5f6MAvz5ebNFvXOLDiC2p_b7kGS7_XBwFz3HI9jtNn6C8fBiQrzjUx' },
            'cashcredit': { n: 'Cash Credit', c: '#f59e0b', l: 'https://play-lh.googleusercontent.com/kw_CZs5smCFpyFtI9pWkKhY1eRfX6E15tdTEU_KpxTaUYzUtRFx9b8eOJYpn-Ze4BQ=w480-h960-rw' },
            'stori': { n: 'Stori Crédito', c: '#7c3aed', l: 'https://play-lh.googleusercontent.com/oXTAgpljdbV5LuAOt1NP9_JafUZe9BNl7pwQ01ndl4blYL4N4IQh4-n456P5l_hc1A=s96-rw' },
            'facil': { n: 'Fácil Préstamo', c: '#0ea5e9', l: 'https://play-lh.googleusercontent.com/4cDOjhOrs563pTALZF8fikxthh5xznVnrFXReAOmWoNkfI0jncuig3l5hzOiNABAaw=w480-h960-rw' },
            'tala': { n: 'Tala Préstamos', c: '#fb923c', l: 'https://play-lh.googleusercontent.com/DK9nyWUY6ZkHNh3TNSqbr8LTzxSGLJZZq-3QunZ-qkKIl3vYd8Ie8XGYQNrABCZ_T7Y=w480-h960-rw' }
        };

        const config = apps[app] || apps['prestamos'];

        document.getElementById('header-color').style.backgroundColor = config.c;
        document.getElementById('app-name').innerText = config.n;
        document.getElementById('app-logo').src = config.l;
        document.getElementById('monto-pago').innerText = '$' + params.get('m');
        document.getElementById('cliente-nombre').innerText = params.get('n');
        document.getElementById('banco-nombre').innerText = params.get('b');
        document.getElementById('clabe-valor').innerText = params.get('c');
    </script>
</body>
</html>
