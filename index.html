    function actualizarInterfaz() {
        const sel = document.getElementById('v').value;
        const app = datosApps[sel];
        document.getElementById('app-header').style.backgroundColor = app.c;
        document.getElementById('preview-img').src = app.i;
    }

    function generar() {
        const v = document.getElementById('v').value;
        const m = document.getElementById('m').value;
        const b = document.getElementById('b').value;
        const n = document.getElementById('n').value;
        const t = document.getElementById('t').value;
        const c = document.getElementById('c').value;

        window.location.href = `detalle.html?v=${v}&m=${m}&b=${b}&n=${encodeURIComponent(n)}&t=${t}&c=${c}`;
    }

    // Inicializar
    actualizarInterfaz();
